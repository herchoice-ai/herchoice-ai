[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "herchoice-ai"
version = "0.1.0"
description = "Private, Hausa-first reproductive health information and referral for women and girls"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "MUMSA Consanguinity Limited" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Natural Language :: Hausa",
    "Natural Language :: English",
]

[project.optional-dependencies]
speech = ["transformers>=4.40", "torch>=2.2", "numpy>=1.26"]
dev = ["pytest>=8"]

[project.scripts]
herchoice-demo = "herchoice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
